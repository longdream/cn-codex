<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CN-Codex</title>
    <script>
      (() => {
        const SETTINGS_SNAPSHOT_KEY = "cn-codex:settings-snapshot";
        const LAYOUT_SNAPSHOT_KEY = "cn-codex:layout-snapshot";

        const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
        const parseSnapshot = (raw) => {
          if (!raw) return null;
          try {
            const parsed = JSON.parse(raw);
            return parsed && typeof parsed === "object" ? parsed : null;
          } catch {
            return null;
          }
        };
        const safeGetItem = (key) => {
          try {
            return window.localStorage.getItem(key);
          } catch {
            return null;
          }
        };

        const root = document.documentElement;
        const settingsSnapshot = parseSnapshot(safeGetItem(SETTINGS_SNAPSHOT_KEY));
        const themeMode = settingsSnapshot?.theme;
        const prefersLight = window.matchMedia?.("(prefers-color-scheme: light)")?.matches;
        const resolvedTheme =
          themeMode === "light"
            ? "light"
            : themeMode === "system"
              ? (prefersLight ? "light" : "dark")
              : "dark";

        root.dataset.theme = resolvedTheme;
        root.style.colorScheme = resolvedTheme;
        root.style.setProperty("--boot-bg", resolvedTheme === "light" ? "#f5f5f5" : "#1a1a1a");
        root.style.setProperty("--boot-fg", resolvedTheme === "light" ? "#4b5563" : "#d1d5db");

        const layoutSnapshot = parseSnapshot(safeGetItem(LAYOUT_SNAPSHOT_KEY));
        if (layoutSnapshot) {
          if (Number.isFinite(layoutSnapshot.sidebarWidth)) {
            const sidebar = clamp(layoutSnapshot.sidebarWidth, 220, 520);
            root.style.setProperty("--startup-sidebar-width", `${sidebar}px`);
          }
          if (Number.isFinite(layoutSnapshot.rightPanelWidth)) {
            const rightPanel = clamp(layoutSnapshot.rightPanelWidth, 320, 760);
            root.style.setProperty("--startup-right-panel-width", `${rightPanel}px`);
          }
        }
      })();
    </script>
    <style>
      /*
       * 启动白屏兜底样式：
       * 发布版在 JS/CSS 还未加载完成时，WebView 会先显示 index.html。
       * 启动脚本会优先从本地快照恢复主题与关键布局参数，减少首屏抖动。
       */
      :root {
        --boot-bg: #1a1a1a;
        --boot-fg: #d1d5db;
        --startup-sidebar-width: 256px;
        --startup-right-panel-width: 384px;
      }

      html, body, #root {
        width: 100%;
        height: 100%;
        margin: 0;
        background: var(--boot-bg);
      }

      body {
        color: var(--boot-fg);
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      .boot-splash {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        font-size: 12px;
        letter-spacing: 0.08em;
        opacity: 0.8;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- React 挂载前的占位内容；挂载后会被完整替换。 -->
      <div class="boot-splash">CN-Codex 正在启动...</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
