[build]
# Do not force incremental globally.
# Dev profile still enables it in Cargo.toml; release builds stay leaner
# and avoid multi-GB pre-LTO / incremental bitcode accumulation.
incremental = false

[registries.crates-io]
protocol = "sparse"

[source.crates-io]
replace-with = "rsproxy-sparse"

[source.rsproxy-sparse]
registry = "sparse+https://rsproxy.cn/index/"

[net]
git-fetch-with-cli = true
retry = 3

[http]
timeout = 60
multiplexing = false
